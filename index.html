<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Am Sorry, Karuna 🧸🌹</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe3e3 0%, #fbc2eb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(225, 112, 150, 0.3);
            max-width: 400px;
            width: 100%;
            border: 2px solid #ffb3c1;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #d90429;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .name {
            color: #ff4d6d;
            font-size: 2.5rem;
            display: block;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .emoji-gif {
            font-size: 5rem;
            margin: 15px 0;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        p {
            color: #4a4a4a;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .message-box {
            background: #fff0f3;
            padding: 15px;
            border-radius: 15px;
            border-left: 5px solid #ff4d6d;
            font-style: italic;
            margin-bottom: 25px;
        }

        /* The trick to keeping them separated initially */
        .btn-wrapper {
            position: relative;
            width: 100%;
            height: 120px; /* Gives plenty of room for the NO button to jump around */
            margin-top: 20px;
        }

        button {
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            position: absolute;
            transition: all 0.15s ease-out;
        }

        /* Fixed Left side with space */
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            left: 15%;
            top: 20px;
        }

        /* Fixed Right side with space initially */
        #noBtn {
            background-color: #6c757d;
            color: white;
            right: 15%;
            top: 20px;
            touch-action: none; /* Crucial for mobile to stop clicks */
        }

        /* Success Screen */
        .hidden {
            display: none !important;
        }

        .success-title {
            color: #d90429;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .kiss-rain {
            font-size: 4rem;
            margin: 20px 0;
        }

        /* Floating background elements */
        .heart {
            position: absolute;
            color: rgba(255, 77, 109, 0.4);
            font-size: 1.5rem;
            animation: float 5s linear infinite;
            z-index: 1;
            bottom: -50px;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <script>
        // Background floating hearts
        for (let i = 0; i < 15; i++) {
            let heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heart.style.fontSize = Math.random() * 20 + 15 + 'px';
            document.body.appendChild(heart);
        }
    </script>

    <div class="container" id="mainCard">
        <h1>I Am So Sorry</h1>
        <span class="name">My Love Karuna </span>
        
        <div class="emoji-gif">🧸🌹✨</div>

        <div class="message-box">
            My heart hurts knowing I upset you. You mean the absolute world to me, and I promise to make it up to you. Please forgive your teddy bear? 🥺"
        </div>

        <p style="font-weight: bold; color: #ff4d6d;">Do you forgive me?</p>

        <div class="btn-wrapper">
            <button id="yesBtn" onclick="forgiveSuccess()">YES</button>
            <button id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()" ontouchstart="moveNoButton()">NO</button>
        </div>
    </div>

    <div class="container hidden" id="successCard">
        <h1 class="success-title">Yayyy! Thank You! 💖</h1>
        <div class="kiss-rain">💋💋💋</div>
        <p style="font-size: 1.3rem; font-weight: bold; color: #ff4d6d;">
            I love you so much, Karuna! <br> Sending you a million kisses! 😘❤️
        </p>
        <div style="font-size: 3.5rem; margin-top: 15px;">🧸❤️🌹</div>
    </div>

    <script>
        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const wrapper = document.querySelector('.btn-wrapper');
            
            // Get available area inside the wrapper card
            const maxWidth = wrapper.clientWidth - noBtn.clientWidth;
            const maxHeight = 250; // Allows it to jump up or down significantly out of reach

            // Generate random layout positions
            const randomX = Math.floor(Math.random() * maxWidth);
            // Gives it vertical movement so her thumb misses it entirely
            const randomY = Math.floor(Math.random() * maxHeight) - 80; 

            // Apply positions instantly
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function forgiveSuccess() {
            document.getElementById('mainCard').classList.add('hidden');
            document.getElementById('successCard').classList.remove('hidden');
            
            // Trigger the kiss rain explosion
            for(let i=0; i<25; i++) {
                setTimeout(createKiss, i * 120);
            }
        }

        function createKiss() {
            const kiss = document.createElement('div');
            kiss.innerHTML = '💋';
            kiss.style.position = 'fixed';
            kiss.style.left = Math.random() * 100 + 'vw';
            kiss.style.top = '100vh';
            kiss.style.fontSize = Math.random() * 2 + 1.5 + 'rem';
            kiss.style.zIndex = '999';
            kiss.style.transition = 'transform 2.5s ease-out, opacity 2.5s';
            
            document.body.appendChild(kiss);
            
            setTimeout(() => {
                kiss.style.transform = `translateY(-110vh) scale(${Math.random() * 1.5 + 0.5})`;
                kiss.style.opacity = '0';
            }, 50);

            setTimeout(() => {
                kiss.remove();
            }, 2500);
        }
    </script>
</body>
</html>
